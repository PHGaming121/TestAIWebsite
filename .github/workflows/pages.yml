name: Deploy site to GitHub Pages

# Publishes the static documentation site in site/ to GitHub Pages.
# The OpenClaw Gateway itself is NOT deployed here — GitHub Pages cannot run a
# stateful Node server. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reports/**'
      - 'openclaw/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # Jekyll would otherwise drop paths beginning with an underscore.
          touch _site/.nojekyll
          echo "Staged files:"
          find _site -type f | sort

      - name: Sanity-check the artifact
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "::error::_site/index.html is missing"; exit 1; }
          test -f _site/assets/style.css || { echo "::error::stylesheet missing"; exit 1; }
          # Guard against publishing a credential by accident.
          if grep -rInE '(sk-or-v1-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' _site/; then
            echo "::error::possible secret detected in site artifact — refusing to deploy"
            exit 1
          fi
          echo "Artifact checks passed."

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages with source "GitHub Actions" if it is not
          # already enabled. This needs a token that may create the Pages
          # site; when it cannot, the next step explains what to change.
          enablement: true
        continue-on-error: true

      - name: Explain Pages setup failure
        if: steps.pages.outcome == 'failure'
        run: |
          cat <<'MSG'
          ::error title=GitHub Pages needs a one-time setting change::This repository's Pages site is not set up for workflow deploys.

          Fix it once, then re-run this workflow:

            1. Open  Settings -> Pages  (link below)
            2. Under "Build and deployment" -> "Source", choose  GitHub Actions
            3. Re-run this workflow (Actions -> "Deploy site to GitHub Pages" -> Re-run all jobs)

          If the site is currently set to "Deploy from a branch", switching the
          source also stops the old branch-based build from overwriting this one.
          MSG
          echo "::notice::Settings page: ${{ github.server_url }}/${{ github.repository }}/settings/pages"
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
