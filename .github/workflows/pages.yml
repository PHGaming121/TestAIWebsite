name: Deploy site to GitHub Pages

# Publishes the static documentation site in site/ to GitHub Pages.
# The OpenClaw Gateway itself is NOT deployed here — GitHub Pages cannot run a
# stateful Node server. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reports/**'
      - 'openclaw/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # Jekyll would otherwise drop paths beginning with an underscore.
          touch _site/.nojekyll
          echo "Staged files:"
          find _site -type f | sort

      - name: Sanity-check the artifact
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "::error::_site/index.html is missing"; exit 1; }
          test -f _site/assets/style.css || { echo "::error::stylesheet missing"; exit 1; }
          # Guard against publishing a credential by accident.
          if grep -rInE '(sk-or-v1-|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' _site/; then
            echo "::error::possible secret detected in site artifact — refusing to deploy"
            exit 1
          fi
          echo "Artifact checks passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
