name: Deploy Forge to GitHub Pages

# Publishing is why the site URL works at all: if Pages is disabled for the
# repository, https://<owner>.github.io/<repository>/ answers with GitHub's own
# 404 page and no JavaScript from this project ever runs. This workflow
# therefore (1) enables Pages if it is missing, and (2) has a fallback job that
# publishes the same files to a `gh-pages` branch when the Pages API refuses to
# create the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js compressor.js skills.js favicon.svg _site/
          touch _site/.nojekyll
          for file in index.html styles.css app.js compressor.js skills.js favicon.svg; do
            if [ ! -s "_site/$file" ]; then
              echo "::error::Expected site file $file is missing or empty."
              exit 1
            fi
          done
          ls -la _site

      - name: Sanity check the JavaScript parses
        run: |
          for file in app.js compressor.js skills.js; do
            node --check "_site/$file"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome || 'skipped' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # `enablement: true` creates the Pages site when the workflow token is
      # allowed to. When it is not (the token needs repository admin rights to
      # create a Pages site), this step fails and the gh-pages job below takes
      # over, so a push still ends with a green run and a fresh site.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Report the published URL
        if: steps.deployment.outcome == 'success'
        run: |
          echo "### Forge is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Note that the gh-pages branch is used instead
        if: steps.deployment.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for Actions deployment on this repository, so the site is published from the gh-pages branch instead. If the site URL still 404s, open Settings -> Pages, set Source to 'Deploy from a branch', choose gh-pages and / (root), then re-run this workflow."

  publish-branch:
    name: Fallback publish to gh-pages
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.deploy.outputs.deployed != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish the same files to a gh-pages branch
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js compressor.js skills.js favicon.svg _site/
          touch _site/.nojekyll
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publish Forge site"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages

      - name: Explain what to do next
        run: |
          echo "### Site published to the gh-pages branch" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow token cannot create a Pages site on this repository, so the built files are kept on the **gh-pages** branch." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ still shows GitHub's 404 page, do this once:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Settings -> Pages -> Build and deployment -> Source: **Deploy from a branch**." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Branch: **gh-pages**, folder: **/ (root)**, then Save." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Re-run this workflow (or push any commit to main) to refresh the branch." >> "$GITHUB_STEP_SUMMARY"
