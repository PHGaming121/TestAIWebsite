<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puter Playground — not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;height:100vh;display:grid;place-content:center;gap:14px;justify-items:center;
       background:#0a0c11;color:#e7eaf1;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:20px}
  .mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#7c5cff,#22d3ee)}
  a{color:#22d3ee;text-decoration:none;font-weight:600}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#a7afc2}
</style>
</head>
<body>
  <div class="mark"></div>
  <h1 style="margin:0;font-size:22px">404 — nothing here</h1>
  <p style="margin:0;color:#a7afc2;max-width:420px">
    That path does not exist. The playground is a single-page app, so head back to the start.
  </p>
  <a id="home" href="./">← Open Puter Playground</a>
  <code id="path"></code>
<script>
  // Keep the link correct whether the site is served from "/" or from a project sub-path.
  var base = location.pathname.replace(/\/[^/]*$/, '/');
  document.getElementById('home').href = base || './';
  document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
